[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-analysis"
version = "0.1.0"
description = "Analysis code for RIXS spectra from VERITAS (MAX IV)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "openpyxl",     # pandas needs it to read the .xlsx run tables
    "h5py",
    "matplotlib",
    "lmfit",
]
# NOTE: rixsaqlib (VERITAS DLD reader) is not on PyPI; a vendored copy lives
# in extern/rixsaqlib and is installed alongside the project (see below).

[project.optional-dependencies]
dev = ["jupyterlab", "ipykernel", "nbstripout", "pre-commit", "pytest", "ruff"]

[tool.setuptools]
package-dir = { "" = "src", "rixsaqlib" = "extern/rixsaqlib" }
py-modules = ["RIXS_functions", "beamtimes", "calibration", "daq", "fitting_functions", "spectrum", "veritas_paths"]
packages = ["rixsaqlib"]

# Pylance/Pyright can't follow setuptools' editable-install import hook, so
# point it at the source dirs directly (extern/ contains the rixsaqlib package).
[tool.pyright]
extraPaths = ["src", "extern"]

[tool.ty.environment]
extra-paths = ["src", "extern"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
extend-exclude = ["extern"]

[tool.ruff.lint.isort]
# veritas_paths turns off HDF5 file locking, which only works if it is
# imported before h5py, so it gets a section ahead of third-party imports.
section-order = ["future", "standard-library", "hdf5-setup", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
"hdf5-setup" = ["veritas_paths"]
