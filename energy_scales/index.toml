# Which energy scale each run uses, grouped by beamtime key (as in config.local.toml).
# The code reads this file: src/beamtimes.py (run-table beamtimes) and
# src/calibration.py (acq-numbered beamtimes, n26 onwards).
#
# Run-table beamtimes (d22-m24):
#   first_row / last_row: inclusive, 0-based row in that beamtime's runinfo table
#     (the `index` passed to RIXS_run). No last_row means "to the end".
# Acq-numbered beamtimes (n26 onwards), written by calibration.save_energy_scale:
#   first_acq / last_acq: inclusive acquisition range; acq numbers keep
#     counting across raw files, so no last_acq = to the end of the beamtime.
#   arm_energy: the arm energy (eV) the scale was calibrated at; loading an
#     acquisition recorded at another arm energy warns.
#   If several entries cover an acquisition, the last one wins.
# offset_eV: added to the .npy when it is loaded.
#
# Never overwrite a .npy; add a new file and a new entry.

[[d22]]
file      = "escale_ice_whole_detector.npy"   # not in the repo yet; loading d22 scales raises until it is added
first_row = 0
offset_eV = -0.78
reference = "-2.4 + 1.62 eV, carried over from the code"

